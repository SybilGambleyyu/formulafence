name: FormulaFence
description: Enforce local-first semantic spreadsheet policies in GitHub Actions.
author: FormulaFence contributors

branding:
  icon: shield
  color: purple

inputs:
  baseline:
    description: Approved .xlsx/.xlsm workbook, or a directory portfolio, inside the workspace.
    required: true
  candidate:
    description: Candidate .xlsx/.xlsm workbook, or a directory portfolio, inside the workspace.
    required: true
  policy:
    description: Optional FormulaFence policy inside the workspace. A directory run applies it to matched workbooks, membership changes, and static cross-workbook impact evidence.
    required: false
    default: ''
  format:
    description: "Report format: markdown, json, or sarif."
    required: false
    default: markdown
  output:
    description: Report path within the GitHub workspace.
    required: false
    default: formulafence-report.md
  redact-external-workbook-links:
    description: Replace visible literal external-workbook link material in the shared report without changing comparison or policy results.
    required: false
    default: 'false'
  redact-formula-external-actions:
    description: Replace visible formula external-action/DDE material and known static action inputs in the shared report without changing comparison or policy results.
    required: false
    default: 'false'
  redact-python-in-excel:
    description: Replace visible Python-in-Excel PY source material and known static PY inputs in the shared report without changing comparison or policy results.
    required: false
    default: 'false'
  redact-office-custom-functions:
    description: Replace visible Office custom-function material and known static custom-function inputs in the shared report without changing comparison or policy results.
    required: false
    default: 'false'
  redact-unqualified-runtime-functions:
    description: Replace visible unqualified runtime-function material and known static runtime-function inputs in the shared report without changing comparison or policy results.
    required: false
    default: 'false'
  redact-worksheet-code-resource-registrations:
    description: Replace visible worksheet code-resource registration material and known static registration inputs in the shared report without changing comparison or policy results.
    required: false
    default: 'false'
  redact-formula-defined-xlm-registrations:
    description: Replace visible formula-defined XLM registration material and known static registration inputs in the shared report without changing comparison or policy results.
    required: false
    default: 'false'
  redact-formula-defined-xlm-evaluations:
    description: Replace visible formula-defined XLM evaluation material and known static evaluation inputs in the shared report without changing comparison or policy results.
    required: false
    default: 'false'
  redact-formula-defined-xlm-actions:
    description: Replace visible formula-defined XLM action material and known static action inputs in the shared report without changing comparison or policy results.
    required: false
    default: 'false'
  fail-on:
    description: Also fail when a non-policy change or finding reaches this severity.
    required: false
    default: none
  max-workbooks:
    description: Maximum supported .xlsx/.xlsm workbooks per directory portfolio before the action fails closed.
    required: false
    default: '512'
  max-link-impact:
    description: Maximum static cross-workbook dependency graph states for a directory portfolio before the action fails closed.
    required: false
    default: '100000'
  install:
    description: Install FormulaFence from this pinned action before running it.
    required: false
    default: 'true'
  upload-artifact:
    description: Upload the report as a workflow artifact after comparison, including on a policy failure.
    required: false
    default: 'true'
  artifact-name:
    description: Name to use when upload-artifact is enabled.
    required: false
    default: formulafence-report

outputs:
  report-path:
    description: Absolute path of the generated report in the GitHub workspace.
    value: ${{ steps.run.outputs.report-path }}
  exit-code:
    description: FormulaFence's comparison exit code (0, 1, or 2).
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Run FormulaFence
      id: run
      shell: bash
      env:
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_CANDIDATE: ${{ inputs.candidate }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_REDACT_EXTERNAL_WORKBOOK_LINKS: ${{ inputs.redact-external-workbook-links }}
        INPUT_REDACT_FORMULA_EXTERNAL_ACTIONS: ${{ inputs.redact-formula-external-actions }}
        INPUT_REDACT_PYTHON_IN_EXCEL: ${{ inputs.redact-python-in-excel }}
        INPUT_REDACT_OFFICE_CUSTOM_FUNCTIONS: ${{ inputs.redact-office-custom-functions }}
        INPUT_REDACT_UNQUALIFIED_RUNTIME_FUNCTIONS: ${{ inputs.redact-unqualified-runtime-functions }}
        INPUT_REDACT_WORKSHEET_CODE_RESOURCE_REGISTRATIONS: ${{ inputs.redact-worksheet-code-resource-registrations }}
        INPUT_REDACT_FORMULA_DEFINED_XLM_REGISTRATIONS: ${{ inputs.redact-formula-defined-xlm-registrations }}
        INPUT_REDACT_FORMULA_DEFINED_XLM_EVALUATIONS: ${{ inputs.redact-formula-defined-xlm-evaluations }}
        INPUT_REDACT_FORMULA_DEFINED_XLM_ACTIONS: ${{ inputs.redact-formula-defined-xlm-actions }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MAX_WORKBOOKS: ${{ inputs.max-workbooks }}
        INPUT_MAX_LINK_IMPACT: ${{ inputs.max-link-impact }}
        INPUT_INSTALL: ${{ inputs.install }}
        INPUT_UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-github-action.sh"

    - name: Upload FormulaFence report
      if: ${{ inputs.upload-artifact == 'true' && steps.run.outputs.report-written == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.run.outputs.report-path }}
        if-no-files-found: error

    - name: Enforce FormulaFence result
      if: ${{ steps.run.outputs.exit-code != '0' }}
      shell: bash
      env:
        FORMULAFENCE_EXIT_CODE: ${{ steps.run.outputs.exit-code }}
      run: |
        case "$FORMULAFENCE_EXIT_CODE" in
          ''|*[!0-9]*) exit 2 ;;
          *) exit "$FORMULAFENCE_EXIT_CODE" ;;
        esac
